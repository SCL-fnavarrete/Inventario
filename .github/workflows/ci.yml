name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      # `prisma generate` exige que las variables del datasource existan, pero
      # no se conecta a la base. Valores ficticios a proposito: el CI nunca
      # debe alcanzar una base real.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DATABASE_URL_UNPOOLED: postgresql://ci:ci@localhost:5432/ci
      NEXTAUTH_SECRET: ci-no-es-un-secreto-solo-para-el-build-0000
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente Prisma
        run: npx prisma generate

      # Una dependencia de la aplicacion con una falla alta o critica frena el
      # merge (auditoria 28-sep-2026, A03). Las de desarrollo no llegan a
      # produccion, por eso --omit=dev.
      - name: Dependencias sin fallas de seguridad
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Con cobertura, no `npm run test` a secas: es lo unico que hace que los
      # umbrales de jest.config.ts bloqueen de verdad.
      - name: Tests + umbrales de cobertura
        run: npm run test:coverage -- --ci

      # El build detecta lo que `tsc` no ve: violaciones de la frontera
      # cliente/servidor, imports que no resuelven en el bundler, y errores de
      # generacion de rutas. Es ademas lo que corre Vercel al desplegar.
      # Todas las paginas del dashboard son dinamicas, asi que el build no
      # consulta la base y las variables ficticias de arriba alcanzan.
      - name: Build
        run: npm run build

  # Las migraciones aplicadas desde cero sobre un Postgres vacio (igual que la
  # primera vez en produccion), sin deriva contra el schema, y los tests de
  # integracion contra esa base. Detecta una migracion que depende de otra
  # posterior en el orden, o un schema editado sin su migracion.
  integracion:
    name: migraciones · integración
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: inventario_it_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Los tests de integracion solo corren si la base se llama *_test.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/inventario_it_test
      DATABASE_URL_UNPOOLED: postgresql://ci:ci@localhost:5432/inventario_it_test
      NEXTAUTH_SECRET: ci-no-es-un-secreto-solo-para-el-build-0000
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente Prisma
        run: npx prisma generate

      - name: Aplicar las migraciones desde cero
        run: npx prisma migrate deploy

      - name: El schema coincide con las migraciones
        run: npx prisma migrate diff --from-schema-datasource prisma/schema.prisma --to-schema-datamodel prisma/schema.prisma --exit-code

      # Uno tras otro (--runInBand): comparten una sola base y algunos tests cuentan
      # filas de toda la tabla (ej. los indicadores de lineas); en paralelo, los
      # archivos se pisan y el resultado depende de la velocidad de la maquina.
      - name: Tests de integracion
        run: npx jest src/__tests__/integracion --ci --runInBand

  spec-guard:
    name: SPEC primero
    runs-on: ubuntu-latest
    # En un push directo no hay base contra la cual comparar de forma fiable
    # cuando es el primer commit de la rama; el guard vive en el PR, que es
    # donde se decide el merge.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: El schema no cambia sin el SPEC
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          changed="$(git diff --name-only "$BASE" "$HEAD")"
          echo "Archivos modificados:"
          echo "$changed" | sed 's/^/  /'

          if ! echo "$changed" | grep -qx 'app/prisma/schema.prisma'; then
            echo "::notice::El schema no cambia en este PR. Nada que verificar."
            exit 0
          fi

          if echo "$changed" | grep -qx 'SPEC_SISTEMA_INVENTARIO_IT.md'; then
            echo "::notice::Schema y SPEC cambian juntos."
            exit 0
          fi

          echo "::error file=app/prisma/schema.prisma::Este PR modifica el modelo de datos sin actualizar SPEC_SISTEMA_INVENTARIO_IT.md."
          cat <<'MSG'

            Regla de oro del proyecto (CLAUDE.md > Proceso SDD):

              El SPEC debe actualizarse primero, o simultaneamente en el mismo
              commit. Nunca despues.

            Este PR toca app/prisma/schema.prisma pero no
            SPEC_SISTEMA_INVENTARIO_IT.md. Documenta el modelo o campo nuevo
            con su tipo, restricciones y proposito, agrega las reglas de
            negocio asociadas y suma la entrada al "Changelog SPEC".

          MSG
          exit 1
